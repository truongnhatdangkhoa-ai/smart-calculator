name: Build APK

# Tự chạy mỗi khi bạn push lên nhánh main/master, hoặc bấm tay ở tab Actions ▸ Build APK ▸ Run workflow.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # cần để đính APK vào mục Releases

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cài thư viện
        run: npm install

      - name: Kiểm thử
        run: npm test

      - name: Build web
        run: npm run build

      - name: Tạo dự án Android (nếu chưa có thư mục android/)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Đồng bộ web vào Android
        run: npx cap sync android

      - name: Build APK debug
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đổi tên APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk may-tinh-khoa-hoc.apk

      - name: Lưu APK (tab Actions ▸ Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: may-tinh-khoa-hoc-apk
          path: may-tinh-khoa-hoc.apk

      - name: Đăng APK lên Releases (bản "latest")
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest may-tinh-khoa-hoc.apk \
            --title "Bản mới nhất" \
            --notes "APK debug tự build từ commit ${GITHUB_SHA::7}. Cài lên Android: tải file, mở, cho phép cài từ nguồn không rõ."
